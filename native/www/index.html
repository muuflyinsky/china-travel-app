<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>China Travel Buddy</title>
<style>
  :root { --bg: #f7f8fb; --ink: #1a1f2e; --muted: #5b6275; --cobalt: #2b4acb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12141c; --ink: #eef0f6; --muted: #9aa1b4; --cobalt: #8fa3ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.5 -apple-system, "PingFang SC", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 16px; background: var(--cobalt); color: #fff; font: 600 17px -apple-system, sans-serif; }
</style>
</head>
<body>
<main>
  <h1 id="h">No connection</h1>
  <p id="p">China Travel Buddy needs the internet to read menus, find places and check prices. Check Wi-Fi or mobile data, then try again.</p>
  <button id="b" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
</main>
<script>
  // The few words this page needs, in the six interface languages.
  var T = {
    es: ["Sin conexión", "China Travel Buddy necesita internet para leer cartas, buscar lugares y consultar precios. Revisa el wifi o los datos móviles e inténtalo de nuevo.", "Reintentar"],
    fr: ["Pas de connexion", "China Travel Buddy a besoin d’internet pour lire les menus, trouver des lieux et vérifier les prix. Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.", "Réessayer"],
    de: ["Keine Verbindung", "China Travel Buddy braucht Internet, um Speisekarten zu lesen, Orte zu finden und Preise zu prüfen. Prüfe WLAN oder mobile Daten und versuche es erneut.", "Erneut versuchen"],
    ja: ["接続できません", "メニューの読み取り、場所の検索、価格の確認にはインターネットが必要です。Wi-Fiまたはモバイルデータを確認して、もう一度お試しください。", "再試行"],
    ko: ["연결 없음", "메뉴 읽기, 장소 찾기, 가격 확인에는 인터넷이 필요해요. Wi-Fi나 모바일 데이터를 확인한 뒤 다시 시도해 주세요.", "다시 시도"],
  };
  var t = T[(navigator.language || "en").slice(0, 2)];
  if (t) { document.documentElement.lang = navigator.language; h.textContent = t[0]; p.textContent = t[1]; b.textContent = t[2]; }
</script>
</body>
</html>
