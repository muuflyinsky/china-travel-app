# Gate for every pull request and every push to main: types, the offline allergen regression
# (no model or network calls), and a production build. Vercel deploys main, so main should only
# move through a pull request that passed this (Settings → Branches → protect main, require "verify").
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Allergen regression (fails on any new leak)
        run: npm run check:allergens
      - run: npm run build
