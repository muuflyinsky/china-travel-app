# Matches guide-listed restaurants to Amap once each (photos, signature-dish tags, price, hours),
# skipping any already looked up (also those the app saved). By hand only (Actions → Restaurants →
# Run workflow): about one call per restaurant; use city/limit to stay within the daily quota.
# Secrets: AMAP_KEY (required); SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY to also write the
# restaurants table (apply supabase/migrations/0005 first).
name: Restaurants
on:
  workflow_dispatch:
    inputs:
      city: { description: "City adcode (e.g. 110000 for Beijing); empty = all", required: false, default: "" }
      limit: { description: "Max restaurants to match this run (0 = no limit)", required: false, default: "0" }
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Match to Amap
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$AMAP_KEY" ]; then echo "AMAP_KEY secret missing; skipping."; exit 0; fi
          args=""
          [ -n "${{ inputs.city }}" ] && args="$args --city ${{ inputs.city }}"
          [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ] && args="$args --limit ${{ inputs.limit }}"
          node scripts/enrich-restaurants.mjs $args
      - name: Commit
        run: |
          git config user.name "restaurants-bot"
          git config user.email "restaurants-bot@users.noreply.github.com"
          git add lib/data/restaurant-places.json docs/reports
          git diff --cached --quiet || (git commit -m "Refresh restaurant Amap data" && git pull --rebase && git push)
